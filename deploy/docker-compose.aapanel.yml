# Production stack: aaPanel host nginx terminates HTTPS for the mcp, docs, blog
# and dashboard hosts (deploy/nginx/aapanel/) and proxies them to the app on
# 127.0.0.1:3001. The knowledge MCP container is reachable only on the Compose
# network. The external `n8nmcp-backend` network joins the app to the
# self-hosted Supabase stack (deploy/supabase/docker-compose.aapanel.yml).
#
# From the checkout in /opt/n8nmcp-app:
#   ./deploy/update.sh
# or, without pulling:
#   docker compose -f deploy/docker-compose.aapanel.yml --env-file deploy/.env up -d --build
name: n8nmcp-app

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MCP_SITE_URL: ${NEXT_PUBLIC_MCP_SITE_URL:?required}
        NEXT_PUBLIC_MCP_ENDPOINT_URL: ${NEXT_PUBLIC_MCP_ENDPOINT_URL:?required}
        NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:?required}
        NEXT_PUBLIC_BLOG_URL: ${NEXT_PUBLIC_BLOG_URL:?required}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:?required}
        NEXT_PUBLIC_SECURITY_EMAIL: ${NEXT_PUBLIC_SECURITY_EMAIL:?required}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?required}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?required}
        # Build metadata; deploy/update.sh exports these from git.
        APP_GIT_SHA: ${APP_GIT_SHA:-local}
        APP_GIT_BRANCH: ${APP_GIT_BRANCH:-main}
        APP_BUILT_AT: ${APP_BUILT_AT:-unknown}
        APP_GITHUB_REPO: ${APP_GITHUB_REPO:-gao51-qw/n8nmcp}
        APP_IMAGE_TAG: ${APP_IMAGE_TAG:-local}
    image: n8nmcp-app:local
    container_name: n8nmcp-app
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy
    env_file:
      - .env.app
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      UPSTREAM_N8N_MCP_URL: http://mcp:3000/mcp
      UPSTREAM_N8N_MCP_TOKEN: ${MCP_AUTH_TOKEN:?required}
      NEXT_PUBLIC_MCP_SITE_URL: ${NEXT_PUBLIC_MCP_SITE_URL:?required}
      NEXT_PUBLIC_MCP_ENDPOINT_URL: ${NEXT_PUBLIC_MCP_ENDPOINT_URL:?required}
      NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:?required}
      NEXT_PUBLIC_BLOG_URL: ${NEXT_PUBLIC_BLOG_URL:?required}
      NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:?required}
      NEXT_PUBLIC_SECURITY_EMAIL: ${NEXT_PUBLIC_SECURITY_EMAIL:?required}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?required}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?required}
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - default
      - backend

  mcp:
    build:
      context: ../tools/n8n-knowledge-mcp
      dockerfile: Dockerfile
    image: n8nmcp-knowledge-mcp:local
    container_name: n8nmcp-knowledge-mcp
    restart: unless-stopped
    environment:
      AUTH_TOKEN: ${MCP_AUTH_TOKEN:?required}
      PORT: "3000"
      TRUST_PROXY: "1"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  backend:
    external: true
    name: n8nmcp-backend
