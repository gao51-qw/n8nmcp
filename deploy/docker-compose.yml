# Prebuilt GHCR image variant of the aaPanel production topology.
#
# The production authority is docker-compose.aapanel.yml, built from source in
# /opt/n8nmcp-app and fronted by aaPanel host nginx (deploy/nginx/aapanel/).
# This file runs the same two services from the images that
# .github/workflows/app-image.yml and n8n-knowledge-mcp.yml publish to GHCR, and
# is what deploy.sh, rollback.sh and update-knowledge.sh drive. It publishes the
# app on 127.0.0.1:3001 only, so it sits behind the same host nginx vhosts.
# Never run it on a host that also runs docker-compose.aapanel.yml: both bind
# 127.0.0.1:3001.
#
# Place docker-compose.yml, .env and .env.app together (for example
# /opt/n8nworkflow), then run:
#   docker compose pull
#   docker compose up -d

services:
  app:
    image: ghcr.io/${GHCR_OWNER}/n8nworkflow-app:${APP_IMAGE_TAG:-latest}
    container_name: n8nworkflow-app
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy
    env_file:
      - .env.app
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      UPSTREAM_N8N_MCP_URL: http://mcp:3000/mcp
      UPSTREAM_N8N_MCP_TOKEN: ${MCP_AUTH_TOKEN:?required}
    # Loopback only: aaPanel host nginx is the only public entry point.
    ports:
      - "127.0.0.1:3001:3001"
    # Container hardening: no privilege escalation, drop all Linux capabilities
    # (the Node server needs none). The image already runs as the non-root `node`
    # user. Keeps an app-level RCE from trivially escalating.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 5

  mcp:
    image: ghcr.io/${GHCR_OWNER}/n8n-knowledge-mcp:${MCP_IMAGE_TAG:-latest}
    container_name: n8n-knowledge-mcp
    restart: unless-stopped
    environment:
      AUTH_TOKEN: ${MCP_AUTH_TOKEN:?required}
      PORT: "3000"
      TRUST_PROXY: "1"
    expose:
      - "3000"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
